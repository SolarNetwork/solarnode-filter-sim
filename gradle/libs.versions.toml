[versions]
fastcsv = "4.4.0"
junit-jupiter = "6.0.1"

# SolarNetwork bundles; to use an unreleased version published to the local Ivy repository
# (~/.ivy2/local) with `ant publish`, set the version here and build with -PlocalIvy

sn-common = "4.56.0"
sn-common-expr-spel = "4.2.2"
sn-node = "4.12.0"
sn-node-control-conductor = "2.3.2"
sn-node-control-opmode = "4.2.0"
sn-node-datum-battery-mock = "2.1.0"
sn-node-datum-energymeter-mock = "4.1.2"
sn-node-datum-filter-pvlib = "2.3.0"
sn-node-datum-filter-standard = "4.8.0"
sn-node-datum-filter-tariff = "4.1.1"
sn-node-datum-fixed = "1.0.1"
sn-node-datum-tou = "3.0.2"
sn-node-metrics = "2.2.0"
sn-node-metrics-harvester = "2.1.1"

[libraries]
fastcsv = { module = "de.siegmar:fastcsv", version.ref = "fastcsv" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

sn-common = { module = "net.solarnetwork.common:net.solarnetwork.common", version.ref = "sn-common" }
sn-common-expr-spel = { module = "net.solarnetwork.common:net.solarnetwork.common.expr.spel", version.ref = "sn-common-expr-spel" }
sn-node = { module = "net.solarnetwork.node:net.solarnetwork.node", version.ref = "sn-node" }
sn-node-control-conductor = { module = "net.solarnetwork.node:net.solarnetwork.node.control.conductor", version.ref = "sn-node-control-conductor" }
sn-node-control-opmode = { module = "net.solarnetwork.node:net.solarnetwork.node.control.opmode", version.ref = "sn-node-control-opmode" }
sn-node-datum-battery-mock = { module = "net.solarnetwork.node:net.solarnetwork.node.datum.battery.mock", version.ref = "sn-node-datum-battery-mock" }
sn-node-datum-energymeter-mock = { module = "net.solarnetwork.node:net.solarnetwork.node.datum.energymeter.mock", version.ref = "sn-node-datum-energymeter-mock" }
sn-node-datum-filter-pvlib = { module = "net.solarnetwork.node:net.solarnetwork.node.datum.filter.pvlib", version.ref = "sn-node-datum-filter-pvlib" }
sn-node-datum-filter-standard = { module = "net.solarnetwork.node:net.solarnetwork.node.datum.filter.standard", version.ref = "sn-node-datum-filter-standard" }
sn-node-datum-filter-tariff = { module = "net.solarnetwork.node:net.solarnetwork.node.datum.filter.tariff", version.ref = "sn-node-datum-filter-tariff" }
sn-node-datum-fixed = { module = "net.solarnetwork.node:net.solarnetwork.node.datum.fixed", version.ref = "sn-node-datum-fixed" }
sn-node-datum-tou = { module = "net.solarnetwork.node:net.solarnetwork.node.datum.tou", version.ref = "sn-node-datum-tou" }
sn-node-metrics = { module = "net.solarnetwork.node:net.solarnetwork.node.metrics", version.ref = "sn-node-metrics" }
sn-node-metrics-harvester = { module = "net.solarnetwork.node:net.solarnetwork.node.metrics.harvester", version.ref = "sn-node-metrics-harvester" }
