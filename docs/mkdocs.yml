site_name: SolarNode Filter Simulator
site_url: https://solarnetwork.github.io/solarnode-filter-sim/

theme:
    name: material
    logo: images/solarnode-icon.svg
    features:
        - content.code.annotate
        - content.code.copy
        - navigation.indexes
        - navigation.instant
        - navigation.path
        - navigation.tracking
        - toc.follow
    palette:
        # Palette toggle for light mode
        - scheme: default
          primary: amber
          toggle:
            icon: material/brightness-7
            name: Switch to dark mode

        # Palette toggle for dark mode
        - scheme: slate
          primary: amber
          toggle:
            icon: material/brightness-4
            name: Switch to light mode

extra_css:
  - css/sn.css

plugins:
    - awesome-pages:
        collapse_single_pages: true
    - glightbox:
        auto_caption: true
        background: "#cdcdcd"
    - open-in-new-tab
    - search:
        lang: en

markdown_extensions:

    # Python Markdown
    - abbr
    - admonition
    - attr_list
    - def_list
    - footnotes
    - md_in_html
    - toc:
        permalink: true

    # Python Markdown Extensions
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.betterem:
        smart_enable: all
    - pymdownx.caret
    - pymdownx.details
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.highlight
    - pymdownx.inlinehilite
    - pymdownx.keys
    - pymdownx.mark
    - pymdownx.smartsymbols
    - pymdownx.snippets:
        check_paths: true
    - pymdownx.superfences
    - pymdownx.tabbed:
        alternate_style: true
    - pymdownx.tasklist:
        custom_checkbox: true
    - pymdownx.tilde
