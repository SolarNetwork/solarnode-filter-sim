plugins {
	id 'java'
	id 'distribution'
	id 'com.diffplug.spotless' version '8.10.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'net.ltgt.errorprone' version '5.1.1'
	id 'org.graalvm.buildtools.native' version '1.1.8'
	id 'com.google.osdetector' version '1.7.3'
	id 'org.springframework.boot' version '4.1.1'
}

group = 's10k.node'
version = '0.7.1.dev0'

base {
	archivesName = 'sn-filter-sim'
}


// pass -PlocalIvy to resolve SolarNetwork bundles from the local Ivy repository (where the
// SolarNetwork Ant build publishes unreleased bundles) before Maven Central; -PlocalIvyPath
// can point to a repository other than ~/.ivy2/local
def localIvy = providers.gradleProperty('localIvy').isPresent()

repositories {
	if ( localIvy ) {
		ivy {
			name = 'localIvy'
			url = providers.gradleProperty('localIvyPath')
				.orElse("${System.getProperty('user.home')}/.ivy2/local").get()
			patternLayout {
				artifact '[organisation]/[module]/[revision]/[artifact]-[revision](-[classifier]).[ext]'
				ivy '[organisation]/[module]/[revision]/[artifact]-[revision](-[classifier]).[ext]'
			}
			metadataSources {
				ivyDescriptor()
				artifact()
			}
			content {
				includeGroupByRegex 'net\\.solarnetwork\\..*'
			}
		}
	}
    mavenCentral()
}

/**
 * Turn the compile and runtime configurations of a SolarNetwork Ivy module into Java library
 * variants, because the published Ivy descriptors have no "default" configuration for Gradle to
 * use. Only the module's main jar is included, not its other published artifacts (like the POM).
 */
@CacheableRule
abstract class SolarNetworkIvyVariantRule implements ComponentMetadataRule {

	@Inject
	abstract ObjectFactory getObjects()

	void execute(ComponentMetadataContext context) {
		if ( context.getDescriptor(IvyModuleDescriptor) == null ) {
			return
		}
		def id = context.details.id
		def jar = "${id.name}-${id.version}.jar"
		[
			['apiElements', 'compile', Usage.JAVA_API],
			['runtimeElements', 'runtime', Usage.JAVA_RUNTIME]
		].each { variantName, ivyConf, usage ->
			context.details.addVariant(variantName, ivyConf) {
				attributes {
					attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
					attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, usage))
					attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
						objects.named(LibraryElements, LibraryElements.JAR))
				}
				withFiles {
					removeAllFiles()
					addFile(jar)
				}
			}
		}
	}
}

dependencies {
	errorprone 'com.google.errorprone:error_prone_core:2.50.0'
	errorprone 'com.uber.nullaway:nullaway:0.13.6'

	if ( localIvy ) {
		components {
			all(SolarNetworkIvyVariantRule)
		}
	}

	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// The SolarNetwork bundles declare dependencies for everything they do in a SolarNode, but the
	// simulator uses only the filters and supporting services. These excluded dependencies are
	// not referenced by any class the simulator can reach (checked with a jdeps class-level
	// closure from the filter, chain, runtime service, SpEL, settings, and Jackson 3 codec
	// classes). Re-check when adding new SolarNetwork classes or upgrading the bundles.
	def snExcludes = {
		exclude group: 'commons-beanutils', module: 'commons-beanutils'
		exclude group: 'commons-io', module: 'commons-io'
		exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-cbor'
		exclude group: 'net.solarnetwork.common', module: 'net.solarnetwork.common.osgi'
		exclude group: 'net.solarnetwork.node', module: 'net.solarnetwork.node.dao.jdbc'
		exclude group: 'org.apache.commons', module: 'commons-compress'
		exclude group: 'org.greenbytes.http', module: 'structured-fields'
		exclude group: 'org.osgi', module: 'org.osgi.namespace.implementation'
		exclude group: 'org.osgi', module: 'org.osgi.resource'
		exclude group: 'org.osgi', module: 'org.osgi.service.cm'
		exclude group: 'org.osgi', module: 'osgi.annotation'
		exclude group: 'org.springframework', module: 'spring-context-support'
		exclude group: 'org.springframework', module: 'spring-jdbc'
		exclude group: 'org.springframework', module: 'spring-messaging'
		exclude group: 'org.springframework.security', module: 'spring-security-core'
		exclude group: 'tools.jackson.dataformat', module: 'jackson-dataformat-cbor'
	}
	implementation(libs.sn.common, snExcludes)
	implementation(libs.sn.common.expr.spel, snExcludes)
	implementation(libs.sn.node, snExcludes)
	implementation(libs.sn.node.control.conductor, snExcludes)
	implementation(libs.sn.node.datum.filter.standard, snExcludes)
	implementation(libs.sn.node.datum.filter.tariff, snExcludes)
	implementation(libs.sn.node.datum.filter.pvlib, snExcludes)
	implementation(libs.sn.node.metrics, snExcludes)
	implementation(libs.sn.node.metrics.harvester, snExcludes)

	// used by the SolarNetwork bundles (which declare older versions) and for settings CSV
	implementation libs.fastcsv

	// the web UI, packaged as static resources
	runtimeOnly project(':solarnode-filter-sim-web')

	testImplementation libs.junit.jupiter
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

springBoot {
	mainClass = 's10k.node.sim.filter.FilterSimulatorApplication'

	// generate META-INF/build-info.properties, for the BuildProperties bean (app version);
	// exclude the build time so the output is reproducible and the task stays up-to-date
	buildInfo {
		excludes = ['time']
		properties {
			artifact = 'sn-filter-sim'
			name = 'SolarNode Filter Simulator'
		}
	}
}

tasks.named('test') {
    useJUnitPlatform()
}

[
	compileJava,
	compileTestJava
].each() {
	it.options.release = 25
	it.options.compilerArgs += [
		"-Xlint:all",
		"-Xlint:-options",
		"-Xlint:-path",
		"-Xlint:-try"
	]
	it.options.encoding = "UTF-8"
	if (hasProperty('failOnWarnings') && failOnWarnings.toBoolean()) {
		it.options.compilerArgs += ["-Werror"]
	}
	it.options.errorprone.disable("InlineMeSuggester", "MixedMutabilityReturnType")
}

compileJava {
	it.options.errorprone.enabled = !(hasProperty('errorProneDisabled') && errorProneDisabled.toBoolean());
	it.options.errorprone {
		error("NullAway")
		option("NullAway:OnlyNullMarked", "true")
		option("NullAway:JSpecifyMode", "true")
	}
}

compileTestJava {
	options.compilerArgs += [
		"-Xlint:-serial",
		"-Xlint:-static"
	]
	options.errorprone.disable("BadImport", "CheckReturnValue")
	it.options.errorprone.enabled = (hasProperty('errorProneEnabledTest') && errorProneEnabledTest.toBoolean());
	it.options.errorprone {
		option("NullAway:OnlyNullMarked", "true")
		option("NullAway:JSpecifyMode", "true")
	}
}

jar.manifest {
	attributes('Implementation-Title': name,
	'Implementation-Version': version,
	'Built-By': System.getProperty('user.name'),
	'Built-JDK': System.getProperty('java.version'))
}

javadoc.options {
	encoding = 'UTF-8'
	use = true
	source = "25"
}

tasks.withType(Javadoc) {
	options.addStringOption('Xdoclint:none', '-quiet')
}

// At a test failure, log the stack trace to the console so that we don't
// have to open the HTML in a browser.
test {
	testLogging {
		exceptionFormat = 'full'
		showExceptions = true
		showCauses = true
		showStackTraces = true
	}
	maxHeapSize = '1500m'
}

// A custom filter bundle for the custom filter tests, built like a SolarNode bundle jar that
// embeds a library jar through its Bundle-ClassPath. It is not on the test class path: the tests
// load it from the jar named by the sim.test.filterBundle system property, as the simulator
// loads the jars of sim.filters.path.
sourceSets {
	testFilterLib
	testFilterBundle {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.testFilterLib.output
	}
}

['compileTestFilterLibJava', 'compileTestFilterBundleJava'].each {
	tasks.named(it) {
		options.release = 25
		options.encoding = 'UTF-8'
		options.errorprone.enabled = false
	}
}

def testFilterLibJar = tasks.register('testFilterLibJar', Jar) {
	archiveFileName = 'example-scaling.jar'
	destinationDirectory = layout.buildDirectory.dir('test-filter-bundle/lib')
	from sourceSets.testFilterLib.output
}

def testFilterBundleJar = tasks.register('testFilterBundleJar', Jar) {
	archiveFileName = 'example-filter-bundle.jar'
	destinationDirectory = layout.buildDirectory.dir('test-filter-bundle')
	from sourceSets.testFilterBundle.output
	into('lib') {
		from testFilterLibJar
	}
	// the imports have a missing package and a version the simulator does not have, for the
	// import check, plus imports it must not warn about
	manifest {
		attributes('Bundle-SymbolicName': 'com.example.solarnode.filter;singleton:=true',
			'Bundle-Version': '1.0.0',
			'Bundle-ClassPath': '.,lib/example-scaling.jar',
			'Import-Package': ['com.example.missing;version="[1.0,2.0)"',
				'com.example.optional;resolution:=optional',
				'java.time',
				'net.solarnetwork.common.osgi.service;version="[1.0,2.0)"',
				'net.solarnetwork.node.service;net.solarnetwork.node.service.support;version="[1.15,2.0)"',
				'net.solarnetwork.service;version="[9.0,10.0)"',
				'org.springframework.context;version="[6.2,7.0)"'].join(','))
	}
}

// the same bundle as a bundle project directory, laid out like a SolarNode bundle project: the
// manifest, blueprint, and build.properties, the classes in build/eclipse, and the resources only
// in src, as an Ant build leaves them
def testFilterProject = tasks.register('testFilterProject', Sync) {
	into layout.buildDirectory.dir('test-filter-project/example-filter')
	from('src/testFilterProject')
	from('src/testFilterBundle/resources') {
		include 'OSGI-INF/**'
	}
	from(sourceSets.testFilterBundle.output.classesDirs) {
		into 'build/eclipse'
	}
	from('src/testFilterBundle/resources') {
		exclude 'OSGI-INF/**'
		into 'src'
	}
	from(testFilterLibJar) {
		into 'lib'
	}
}

tasks.named('test') {
	def bundleJar = testFilterBundleJar.flatMap { it.archiveFile }
	inputs.file(bundleJar).withPropertyName('testFilterBundle')
			.withPathSensitivity(PathSensitivity.NONE)
	systemProperty 'sim.test.filterBundle', bundleJar.get().asFile.absolutePath
	def projectDir = layout.buildDirectory.dir('test-filter-project/example-filter')
	inputs.files(testFilterProject).withPropertyName('testFilterProject')
			.withPathSensitivity(PathSensitivity.RELATIVE)
	systemProperty 'sim.test.filterProject', projectDir.get().asFile.absolutePath
}

spotless {
	java {
		targetExclude('**/build/generated/**')
		eclipse()
			.configFile("${project.rootDir}/config/codeformatter.xml")
	}
}

graalvmNative {
	binaries.main {
		def allArgs = []

		// NATIVE_BUILD_ARGS=a,b,c ../gradlew nativeCompile
		providers.environmentVariable('NATIVE_BUILD_ARGS')
			.orNull?.split(',')?.each { allArgs << it }

		// pass -PnativeBuildArgs=a,b,c
		providers.gradleProperty('nativeBuildArgs')
			.orNull?.split(',')?.each { allArgs << it }

		// pass -PnativeBuildArgsFile=dev.args, or default to native-build.args
		def argsFile = providers.gradleProperty('nativeBuildArgsFile')
			.map { file(it) }
			.orElse(file('native-build.args'))
			.get()
        
		if (argsFile.exists()) {
			allArgs.addAll(
				argsFile.readLines()
					.findAll { it && !it.startsWith('#') }
			)
		}

		if (allArgs.isEmpty()) {
			buildArgs.addAll([
				'--enable-native-access=ALL-UNNAMED',
				'-O3',
				'-R:MaxHeapSize=256m',
				'-Duser.language=en',
				'-Duser.country=US',
				'--emit=build-report'
			])
		} else {
			buildArgs.addAll(allArgs)
		}

		imageName = 'sn-filter-sim'
	}
}

tasks.withType(org.springframework.boot.gradle.tasks.aot.ProcessAot).configureEach {
	args(project.findProperty('aotProcessArgs') ?: '')
}

compileAotJava {
	options.errorprone.enabled = false
}

compileAotTestJava {
	options.errorprone.enabled = false
}

distTar {
	archiveExtension = 'tar.gz'
	compression = Compression.GZIP
}

def getOsName() {
	if ( osdetector.os == 'osx' ) {
		return 'darwin' // to work with homebrew-releaser
	}
	return osdetector.os
}

def getArchName() {
	if ( osdetector.arch == 'aarch_64' ) {
		return 'arm64'
	} else if ( osdetector.arch == 'x86_64' ) {
		return 'amd64'
	}
	return osdetector.arch
}

// the main distribution is only the native executable: nativeCompile also writes the build
// report and JDK shim libraries (such as libawt.so) next to it, which the simulator does not
// need at run time; Gradle 9 archives normalize file permissions to rw-r--r--, so the
// executable's are set explicitly
distributions  {
	main {
		distributionBaseName = "solarnode-filter-sim"
		distributionClassifier = getOsName() + '-' + getArchName()
		contents {
			from(tasks.named("nativeCompile")) {
				into('/')
				include('sn-filter-sim', 'sn-filter-sim.exe')
				filePermissions {
					unix('rwxr-xr-x')
				}
			}
		}
	}
}

/**
 * Run the native executable and post each smoke test fixture to it, comparing
 * a summary of each result with the fixture's expected summary.
 *
 * The fixtures are the simulation requests (<name>.json) and expected result
 * summaries (<name>.expected.json) that SmokeFixtureTests also runs on the JVM,
 * and the summary is made the same way. A result that differs, for example
 * because an expression needs a runtime hint the native image lacks, fails the
 * task and is saved as <name>.actual.json in the report directory, next to the
 * executable's log.
 */
abstract class NativeSmokeTest extends DefaultTask {

	@InputFile
	abstract RegularFileProperty getExecutable()

	@InputDirectory
	abstract DirectoryProperty getFixtures()

	@OutputDirectory
	abstract DirectoryProperty getReportDir()

	@Internal
	abstract Property<Integer> getStartTimeoutSeconds()

	@TaskAction
	void smokeTest() {
		def reports = reportDir.get().asFile
		reports.mkdirs()
		def log = new File(reports, 'sn-filter-sim.log')
		int port = new ServerSocket(0).withCloseable { it.localPort }
		def process = new ProcessBuilder(executable.get().asFile.absolutePath,
				"--server.port=${port}", '--spring.main.banner-mode=off')
				.redirectErrorStream(true)
				.redirectOutput(log)
				.start()
		try {
			def http = java.net.http.HttpClient.newHttpClient()
			def base = "http://localhost:${port}/api"
			waitForStart(http, base, process, log)
			def failures = []
			fixtureFiles().each { File f ->
				def name = f.name - '.json'
				// commands kept with the fixtures are referred to by this token
				def body = f.text.replace('@FIXTURES@', f.parentFile.absolutePath)
				def req = java.net.http.HttpRequest.newBuilder(URI.create("${base}/simulate"))
						.header('Content-Type', 'application/json')
						.POST(java.net.http.HttpRequest.BodyPublishers.ofString(body))
						.build()
				def res = http.send(req, java.net.http.HttpResponse.BodyHandlers.ofString())
				if ( res.statusCode() != 200 ) {
					failures << "${name}: HTTP ${res.statusCode()}: ${res.body()}"
					return
				}
				def actual = summary(new groovy.json.JsonSlurper().parseText(res.body()))
				def expected = new groovy.json.JsonSlurper().parse(
						new File(f.parentFile, "${name}.expected.json"))
				if ( actual != expected ) {
					new File(reports, "${name}.actual.json").text =
							groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(actual))
					def diffs = []
					differences('', expected, actual, diffs)
					failures << "${name}: the result differs from ${name}.expected.json:\n  " +
							diffs.take(20).join('\n  ')
				} else {
					logger.lifecycle("${name}: OK")
				}
			}
			if ( failures ) {
				throw new GradleException("Native smoke test failed (see ${reports}):\n"
						+ failures.join('\n'))
			}
		} finally {
			process.destroy()
			if ( !process.waitFor(10, java.util.concurrent.TimeUnit.SECONDS) ) {
				process.destroyForcibly()
			}
		}
	}

	protected List<File> fixtureFiles() {
		fixtures.get().asFile.listFiles()
				.findAll { it.name.endsWith('.json') && !it.name.endsWith('.expected.json') }
				.sort { it.name }
	}

	protected void waitForStart(def http, String base, Process process, File log) {
		def info = java.net.http.HttpRequest.newBuilder(URI.create("${base}/info")).build()
		long deadline = System.currentTimeMillis() + startTimeoutSeconds.getOrElse(60) * 1000L
		while ( true ) {
			if ( !process.alive ) {
				throw new GradleException("The executable exited (${process.exitValue()}):\n${log.text}")
			}
			try {
				def res = http.send(info, java.net.http.HttpResponse.BodyHandlers.ofString())
				if ( res.statusCode() == 200 ) {
					logger.lifecycle("Started ${res.body()}")
					return
				}
			} catch ( IOException e ) {
				// not listening yet
			}
			if ( System.currentTimeMillis() > deadline ) {
				throw new GradleException("The executable did not start:\n${log.text}")
			}
			Thread.sleep(250)
		}
	}

	/** Summarize a result the same way as SmokeFixtureTests. */
	static Object summary(Map result) {
		def datum = result.datum.collect { Map trace ->
			def d = [seq: trace.seq, sourceId: trace.input?.sourceId,
				steps: trace.steps.collect { "${it.filterId}:${it.status}".toString() }]
			if ( trace.error != null ) {
				d.error = trace.error
			}
			if ( trace.output?.samples != null ) {
				d.output = trace.output.samples
			}
			def commands = trace.steps.collectMany { s ->
				(s.commands ?: []).collect { [filterId: s.filterId, ran: it.ran] }
			}
			if ( commands ) {
				d.commands = commands
			}
			d
		}
		def summary = [messages: result.messages.collect { it.code },
			stats: ['processed', 'generated', 'output', 'discarded'].collectEntries {
				[(it): result.stats[it]] },
			datum: datum]
		def metrics = (result.finalState?.metrics ?: []).collect { [name: it.name, value: it.value] }
		if ( metrics ) {
			summary.metrics = metrics
		}
		def controls = (result.finalState?.controls ?: []).collect {
			[controlId: it.controlId, value: it.value, updates: it.updates] }
		if ( controls ) {
			summary.controls = controls
		}
		def runs = (result.instructionRuns ?: []).collect {
			[date: it.date, topic: it.instruction?.topic, state: it.instruction?.state,
				conductor: it.instruction?.conductor, task: it.instruction?.task,
				generated: it.generated] }
		if ( runs ) {
			summary.instructionRuns = runs
		}
		normalized(summary)
	}

	/** Normalize to strings, with numbers in plain notation without trailing zeros. */
	static Object normalized(Object v) {
		if ( v instanceof Map ) {
			return v.findAll { k, x -> x != null }.collectEntries { k, x -> [(k): normalized(x)] }
		} else if ( v instanceof List ) {
			return v.collect { normalized(it) }
		} else if ( v instanceof Number ) {
			return new BigDecimal(v.toString()).stripTrailingZeros().toPlainString()
		}
		return v == null ? '' : v.toString()
	}

	static void differences(String path, Object expected, Object actual, List diffs) {
		if ( expected instanceof Map && actual instanceof Map ) {
			(expected.keySet() + actual.keySet()).each {
				differences("${path}/${it}", expected[it], actual[it], diffs)
			}
		} else if ( expected instanceof List && actual instanceof List ) {
			(0..<Math.max(expected.size(), actual.size())).each {
				differences("${path}[${it}]", it < expected.size() ? expected[it] : null,
						it < actual.size() ? actual[it] : null, diffs)
			}
		} else if ( expected != actual ) {
			diffs << "${path}: expected ${expected} but was ${actual}".toString()
		}
	}

}

tasks.register('nativeSmokeTest', NativeSmokeTest) {
	group = 'verification'
	description = 'Runs the smoke test fixtures against the native executable.'
	dependsOn tasks.named('nativeCompile')
	executable = tasks.named('nativeCompile').flatMap { it.outputFile }
	fixtures = layout.projectDirectory.dir('src/test/resources/s10k/node/sim/filter/smoke')
	reportDir = layout.buildDirectory.dir('reports/native-smoke')
}
